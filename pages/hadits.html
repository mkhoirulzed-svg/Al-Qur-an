<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadits</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
.page-hadits{
  background:var(--bg);
}

.hadits-container{
  padding:18px 18px 110px;
}

.nav-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  background:var(--card);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow-sm);
}

.header-title{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#judul-hadits{
  font-size:17px;
  font-weight:800;
  color:var(--primary);
}

#subjudul-hadits{
  font-size:12px;
  color:var(--text-secondary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.search-box{
  width:100%;
  min-height:48px;
  padding:12px 14px;
  font-size:14px;
  font-weight:700;
  font-family:'Plus Jakarta Sans',sans-serif;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.7);
  margin-bottom:14px;
  background:var(--card);
  color:var(--text);
  box-shadow:var(--shadow-sm);
  outline:none;
}

.search-box:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(10,77,58,.12);
}

.hadits-item{
  background:var(--card);
  border-radius:20px;
  padding:17px 18px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:var(--shadow-sm);
  border:1px solid rgba(255,255,255,.7);
  cursor:pointer;
  transition:.25s ease;
}

.hadits-item:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}

.hadits-item span{
  font-size:15px;
  font-weight:800;
  color:var(--text);
}

.hadits-item i{
  color:var(--primary);
  font-size:13px;
}

#daftarHadits p{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  text-align:center;
  color:var(--text-secondary);
  box-shadow:var(--shadow-sm);
}
</style>
</head>

<body class="page-hadits">

<header class="app-header">
  <button class="nav-btn back-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24" width="22" height="22"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div class="header-title">
    <div id="judul-hadits">Hadits</div>
    <div id="subjudul-hadits">Pilih hadits yang ingin dibaca</div>
  </div>
</header>

<main class="hadits-container">
  <input 
    type="search" 
    id="cariHadits" 
    class="search-box" 
    placeholder="Cari hadits..."
  >

  <div id="daftarHadits">
    <p>Memuat hadits...</p>
  </div>
</main>

<div id="footer"></div>

<script>
const daftarHaditsEl = document.getElementById('daftarHadits');
const cariHaditsEl = document.getElementById('cariHadits');

let semuaHadits = [];

async function loadHadits(){
  try{
    const res = await fetch('../data/hadits.json?v=' + Date.now());

    if(!res.ok){
      throw new Error('File hadits.json tidak ditemukan');
    }

    semuaHadits = await res.json();
    renderDaftarHadits(semuaHadits);

  }catch(err){
    daftarHaditsEl.innerHTML = '<p>Gagal memuat daftar hadits.</p>';
    console.error(err);
  }
}

function renderDaftarHadits(data){
  daftarHaditsEl.innerHTML = '';

  if(!data || data.length === 0){
    daftarHaditsEl.innerHTML = '<p>Hadits tidak ditemukan.</p>';
    return;
  }

  data.forEach(hadits => {
    const item = document.createElement('div');
    item.className = 'hadits-item';

    item.innerHTML = `
      <span>${hadits.judul || 'Tanpa Judul'}</span>
      <i class="fas fa-chevron-right"></i>
    `;

    item.addEventListener('click', () => {
      window.location.href = `detail-hadist.html?id=${encodeURIComponent(hadits.id)}`;
    });

    daftarHaditsEl.appendChild(item);
  });
}

cariHaditsEl.addEventListener('input', () => {
  const keyword = cariHaditsEl.value.toLowerCase().trim();

  const hasil = semuaHadits.filter(hadits =>
    (hadits.judul || '').toLowerCase().includes(keyword)
  );

  renderDaftarHadits(hasil);
});

loadHadits();
</script>

<script src="../data/loader.js"></script>
<script>
  loadFooter("hadits");
</script>

</body>
</html>
