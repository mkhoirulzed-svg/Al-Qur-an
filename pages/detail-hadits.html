<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Hadits</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
.page-hadits{
  background:var(--bg);
}

.hadits-container{
  padding:18px 18px 120px;
}

.nav-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  background:var(--card);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow-sm);
}

.header-title{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#judul{
  font-size:17px;
  font-weight:800;
  color:var(--primary);
}

#subjudul{
  font-size:12px;
  color:var(--text-secondary);
}

.card{
  background:var(--card);
  border-radius:22px;
  padding:22px;
  margin-bottom:16px;
  border:1px solid rgba(255,255,255,.7);
  box-shadow:var(--shadow-sm);
}

.card-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:18px;
  color:var(--primary);
}

.arab{
  font-family:'Amiri',serif;
  font-size:34px;
  line-height:2.1;
  text-align:right;
  direction:rtl;
  color:var(--text);
}

.latin{
  margin-top:22px;
  font-size:15px;
  line-height:1.9;
  color:var(--text);
  font-style:italic;
}

.arti{
  margin-top:22px;
  font-size:16px;
  line-height:1.9;
  color:var(--text);
}

.perawi{
  margin-top:24px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.08);
  color:var(--primary);
  font-weight:700;
  font-size:14px;
}

.loading{
  text-align:center;
  padding:40px;
  color:var(--text-secondary);
}
</style>
</head>

<body class="page-hadits">

<header class="app-header">

<button class="nav-btn" onclick="history.back()">
<svg viewBox="0 0 24 24" width="22" height="22"
fill="none"
stroke="currentColor"
stroke-width="2.5"
stroke-linecap="round"
stroke-linejoin="round">
<polyline points="15 18 9 12 15 6"></polyline>
</svg>
</button>

<div class="header-title">
<div id="judul">Hadits</div>
<div id="subjudul">Memuat...</div>
</div>

</header>

<main class="hadits-container">

<div id="content" class="loading">
Memuat hadits...
</div>

</main>

<div id="footer"></div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");

async function loadHadits(){

try{

const res = await fetch("../data/hadits.json?v="+Date.now());

if(!res.ok){
throw new Error("Gagal memuat hadits");
}

const data = await res.json();

const hadits = data.find(h=>String(h.id)===String(id));

if(!hadits){
document.getElementById("content").innerHTML="<div class='loading'>Hadits tidak ditemukan.</div>";
return;
}

document.getElementById("judul").textContent=hadits.judul;
document.getElementById("subjudul").textContent=hadits.perawi || "";

document.getElementById("content").innerHTML=`

<div class="card">

<div class="card-title">
${hadits.judul}
</div>

<div class="arab">
${hadits.arab || "-"}
</div>

${hadits.latin ? `
<div class="latin">
${hadits.latin}
</div>
` : ""}

<div class="arti">
${hadits.terjemahan || "-"}
</div>

${hadits.perawi ? `
<div class="perawi">
${hadits.perawi}
</div>
` : ""}

</div>

`;

}catch(e){

console.error(e);

document.getElementById("content").innerHTML="<div class='loading'>Gagal memuat hadits.</div>";

}

}

loadHadits();
</script>

<script src="../data/loader.js"></script>
<script>
loadFooter("hadits");
</script>

</body>
</html>
