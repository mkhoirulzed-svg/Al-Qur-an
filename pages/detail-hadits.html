<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Hadits</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
.page-hadits{
  background:var(--bg);
}

.hadits-container{
  padding:18px 18px 120px;
}

.nav-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  background:var(--card);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow-sm);
}

.header-title{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#judul{
  font-size:17px;
  font-weight:800;
  color:var(--primary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#subjudul{
  font-size:12px;
  color:var(--text-secondary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card{
  background:var(--card);
  border-radius:22px;
  padding:22px;
  margin-bottom:16px;
  border:1px solid rgba(255,255,255,.7);
  box-shadow:var(--shadow-sm);
}

.card-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:18px;
  color:var(--primary);
}

.meta-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:18px;
}

.meta-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(10,77,58,.10);
  color:var(--primary);
  font-size:12px;
  font-weight:800;
}

.arab{
  font-family:'Amiri',serif;
  font-size:34px;
  line-height:2.1;
  text-align:right;
  direction:rtl;
  color:var(--text);
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--primary);
  font-weight:800;
  font-size:16px;
  margin:22px 0 10px;
}

.latin{
  font-size:15px;
  line-height:1.9;
  color:var(--text);
  font-style:italic;
}

.arti{
  font-size:16px;
  line-height:1.9;
  color:var(--text);
}

.perawi{
  margin-top:24px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.08);
  color:var(--primary);
  font-weight:700;
  font-size:14px;
  line-height:1.7;
}

.faedah-list{
  margin:0;
  padding-left:22px;
}

.faedah-list li{
  margin-bottom:10px;
  line-height:1.8;
  color:var(--text);
}

.pelajaran{
  font-size:15px;
  line-height:1.9;
  color:var(--text);
}

.loading{
  text-align:center;
  padding:40px;
  color:var(--text-secondary);
}
</style>
</head>

<body class="page-hadits">

<header class="app-header">
  <button class="nav-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24" width="22" height="22"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div class="header-title">
    <div id="judul">Hadits</div>
    <div id="subjudul">Memuat...</div>
  </div>
</header>

<main class="hadits-container">
  <div id="content" class="loading">
    Memuat hadits...
  </div>
</main>

<div id="footer"></div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");
const contentEl = document.getElementById("content");
const judulEl = document.getElementById("judul");
const subjudulEl = document.getElementById("subjudul");

function escapeHTML(text){
  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function renderList(items){
  if(!Array.isArray(items) || items.length === 0) return "";

  return `
    <ul class="faedah-list">
      ${items.map(item => `<li>${escapeHTML(item)}</li>`).join("")}
    </ul>
  `;
}

async function loadHadits(){
  try{
    if(!id){
      contentEl.innerHTML = "<div class='loading'>ID hadits tidak ditemukan.</div>";
      return;
    }

    const res = await fetch("../data/hadits.json?v=" + Date.now());

    if(!res.ok){
      throw new Error("Gagal memuat hadits.json");
    }

    const data = await res.json();
    const hadits = data.find(h => String(h.id) === String(id));

    if(!hadits){
      contentEl.innerHTML = "<div class='loading'>Hadits tidak ditemukan.</div>";
      return;
    }

    judulEl.textContent = hadits.judul || "Hadits";
    subjudulEl.textContent = hadits.perawi || hadits.derajat || "Detail hadits";

    contentEl.className = "";
    contentEl.innerHTML = `
      <div class="card">
        <div class="card-title">${escapeHTML(hadits.judul || "Tanpa Judul")}</div>

        <div class="meta-row">
          ${hadits.kitab ? `
            <div class="meta-badge">
              <i class="fas fa-book"></i>
              ${escapeHTML(hadits.kitab)}
            </div>
          ` : ""}

          ${hadits.nomor ? `
            <div class="meta-badge">
              <i class="fas fa-hashtag"></i>
              No. ${escapeHTML(hadits.nomor)}
            </div>
          ` : ""}

          ${hadits.derajat ? `
            <div class="meta-badge">
              <i class="fas fa-circle-check"></i>
              ${escapeHTML(hadits.derajat)}
            </div>
          ` : ""}
        </div>

        <div class="arab">
          ${escapeHTML(hadits.arab || "-")}
        </div>

        ${hadits.latin ? `
          <div class="section-title">
            <i class="fas fa-language"></i>
            Latin
          </div>
          <div class="latin">
            ${escapeHTML(hadits.latin)}
          </div>
        ` : ""}

        <div class="section-title">
          <i class="fas fa-align-left"></i>
          Terjemahan
        </div>
        <div class="arti">
          ${escapeHTML(hadits.terjemahan || "-")}
        </div>

        ${hadits.perawi ? `
          <div class="perawi">
            ${escapeHTML(hadits.perawi)}
          </div>
        ` : ""}
      </div>

      ${hadits.faedah && hadits.faedah.length ? `
        <div class="card">
          <div class="section-title" style="margin-top:0;">
            <i class="fas fa-lightbulb"></i>
            Faedah Hadits
          </div>
          ${renderList(hadits.faedah)}
        </div>
      ` : ""}

      ${hadits.pelajaran ? `
        <div class="card">
          <div class="section-title" style="margin-top:0;">
            <i class="fas fa-seedling"></i>
            Pelajaran
          </div>
          <div class="pelajaran">
            ${escapeHTML(hadits.pelajaran)}
          </div>
        </div>
      ` : ""}
    `;

  }catch(e){
    console.error(e);
    contentEl.innerHTML = "<div class='loading'>Gagal memuat hadits.</div>";
  }
}

loadHadits();
</script>

<script src="../data/loader.js"></script>
<script>
loadFooter("hadits");
</script>

</body>
</html>
