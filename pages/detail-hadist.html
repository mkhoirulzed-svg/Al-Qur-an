<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Hadits</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
.page-hadits{
  background:var(--bg);
}

.hadits-container{
  padding:18px 18px 120px;
}

.nav-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  background:var(--card);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow-sm);
}

.header-title{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#judul{
  font-size:17px;
  font-weight:800;
  color:var(--primary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#subjudul{
  font-size:12px;
  color:var(--text-secondary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card{
  background:var(--card);
  border-radius:22px;
  padding:22px;
  margin-bottom:16px;
  border:1px solid rgba(255,255,255,.7);
  box-shadow:var(--shadow-sm);
}

.card-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:18px;
  color:var(--primary);
}

.meta-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:18px;
}

.meta-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(10,77,58,.10);
  color:var(--primary);
  font-size:12px;
  font-weight:800;
}

.arab{
  font-family:'Amiri',serif;
  font-size:34px;
  line-height:2.1;
  text-align:right;
  direction:rtl;
  color:var(--text);
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--primary);
  font-weight:800;
  font-size:16px;
  margin:22px 0 10px;
}

.latin{
  font-size:15px;
  line-height:1.9;
  color:var(--text);
  font-style:italic;
}

.arti{
  font-size:16px;
  line-height:1.9;
  color:var(--text);
}

.perawi{
  margin-top:24px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.08);
  color:var(--primary);
  font-weight:700;
  font-size:14px;
  line-height:1.7;
}

.faedah-list{
  margin:0;
  padding-left:22px;
}

.faedah-list li{
  margin-bottom:10px;
  line-height:1.8;
  color:var(--text);
}

.pelajaran{
  font-size:15px;
  line-height:1.9;
  color:var(--text);
}

.loading{
  text-align:center;
  padding:40px;
  color:var(--text-secondary);
.doa-item{
  background:var(--card);
  border-radius:20px;
  padding:17px 18px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:var(--shadow-sm);
  border:1px solid rgba(255,255,255,.7);
  cursor:pointer;
  transition:.25s ease;
}

.doa-item:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}

.doa-item span{
  font-size:15px;
  font-weight:800;
  color:var(--text);
}

.doa-item i{
  color:var(--primary);
  font-size:13px;
}
</style>
</head>

<body class="page-hadits">

<header class="app-header">
  <button class="nav-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24" width="22" height="22"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div class="header-title">
    <div id="judul">Hadits</div>
    <div id="subjudul">Memuat...</div>
  </div>
</header>

<main class="hadits-container">
  <div id="content" class="loading">
    Memuat hadits...
  </div>
</main>

<div id="footer"></div>

<script>
<script>
const detailKitabEl = document.getElementById('detailKitab');
const judulDoaEl = document.getElementById('judul-doa');
const subjudulDoaEl = document.getElementById('subjudul-doa');

const params = new URLSearchParams(window.location.search);
const idKitab = params.get('id');

let kitabAktif = null;
let semuaBab = [];

async function loadDetailKitab(){
  try{
    if(!idKitab){
      throw new Error('ID kitab tidak ditemukan');
    }

    const res = await fetch('../data/kitab.json?v=' + Date.now());

    if(!res.ok){
      throw new Error('File kitab.json tidak ditemukan');
    }

    const data = await res.json();

    kitabAktif = data.find(item => String(item.id) === String(idKitab));

    if(!kitabAktif){
      detailKitabEl.innerHTML = '<p>Kitab tidak ditemukan.</p>';
      subjudulDoaEl.textContent = 'Data tidak tersedia';
      return;
    }

    renderInfoKitab(kitabAktif);

    if(kitabAktif.status !== 'tersedia'){
      renderBelumTersedia(kitabAktif);
      return;
    }

    if(kitabAktif.tipe === 'per-bab' && kitabAktif.daftarBab){
      await loadDaftarBab(kitabAktif);
    }else{
      renderBelumTersedia(kitabAktif);
    }

  }catch(err){
    detailKitabEl.innerHTML = '<p>Gagal memuat detail kitab.</p>';
    subjudulDoaEl.textContent = 'Terjadi kesalahan';
    console.error(err);
  }
}

function renderInfoKitab(kitab){
  const judul = kitab.judul || kitab.kitab || 'Tanpa Judul';

  document.title = judul;
  judulDoaEl.textContent = judul;
  subjudulDoaEl.textContent = kitab.penulis || 'Kitab Hadits';

  detailKitabEl.innerHTML = `
    <article class="doa-card">
      <div class="doa-title">${judul}</div>

      ${kitab.penulis ? `
        <div class="meta">
          <div><b>Penulis:</b> ${kitab.penulis}</div>
        </div>
      ` : ''}

      ${kitab.deskripsi ? `
        <div class="terjemah">${kitab.deskripsi}</div>
      ` : ''}

      ${kitab.status ? `
        <div class="meta">
          <div><b>Status:</b> ${kitab.status === 'tersedia' ? 'Tersedia' : 'Segera hadir'}</div>
        </div>
      ` : ''}
    </article>

    <div id="daftarBabKitab">
      <p>Memuat daftar bab...</p>
    </div>
  `;
}

async function loadDaftarBab(kitab){
  const daftarBabEl = document.getElementById('daftarBabKitab');

  try{
    const pathBab = '../' + kitab.daftarBab;

    const res = await fetch(pathBab + '?v=' + Date.now());

    if(!res.ok){
      throw new Error('File daftar bab tidak ditemukan');
    }

    semuaBab = await res.json();

    if(!semuaBab || semuaBab.length === 0){
      daftarBabEl.innerHTML = '<p>Daftar bab belum tersedia.</p>';
      return;
    }

    daftarBabEl.innerHTML = semuaBab.map(bab => {
      const idBab = String(bab.id).padStart(3, '0');
      const judulBab = bab.judul || bab.kitab || `Bab ${Number(bab.id)}`;

      return `
        <div class="doa-item" onclick="bukaBab('${kitab.id}', '${idBab}')">
          <span>${judulBab}</span>
          <i class="fas fa-chevron-right"></i>
        </div>
      `;
    }).join('');

  }catch(err){
    daftarBabEl.innerHTML = '<p>Gagal memuat daftar bab.</p>';
    console.error(err);
  }
}

function renderBelumTersedia(kitab){
  const daftarBabEl = document.getElementById('daftarBabKitab');

  if(!daftarBabEl) return;

  daftarBabEl.innerHTML = `
    <p>Isi kitab ini belum tersedia.</p>
  `;
}

function bukaBab(idKitab, idBab){
  window.location.href = `kitab-baca.html?kitab=${encodeURIComponent(idKitab)}&bab=${encodeURIComponent(idBab)}`;
}

loadDetailKitab();
</script>
</script>

<script src="../data/loader.js"></script>
<script>
loadFooter("hadits");
</script>

</body>
</html>
