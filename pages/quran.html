<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al-Qur'an</title>

  <link rel="stylesheet" href="../style.css">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header class="app-header">
  <button class="back-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24" width="22" height="22"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <h1 class="header-title">Al-Qur'an</h1>
  <button class="search-btn" id="openSearch">
  <i class="fas fa-search"></i>
</button>
</header>

<main class="container">

<div class="quran-toggle">
  <button id="btnSurah" class="toggle-btn active">Surah</button>
  <button id="btnJuz" class="toggle-btn">Juz</button>
  <button id="btnBookmark" class="toggle-btn">Bookmark</button>
</div>
<div class="search-box" id="searchBox" style="display:none;">
  <input type="text" id="searchInput" placeholder="Cari surah atau terjemahan ayat...">
</div>
  <div id="surahList" class="surah-list"></div>

</main>

  <script src="../data/juz-map.js"></script>
  <script src="../data/surah-names.js"></script>
  
<script>
const list = document.getElementById('surahList');
const btnSurah = document.getElementById('btnSurah');
const btnJuz = document.getElementById('btnJuz');

const params = new URLSearchParams(location.search);
const mode = params.get('mode');

if (mode === 'juz') {
  setActive(btnJuz);
  loadJuz();
} else {
  setActive(btnSurah);
  loadSurah();
}


btnSurah.onclick = () => {
  setActive(btnSurah, btnJuz);
  loadSurah();
};

btnJuz.onclick = () => {
  setActive(btnJuz, btnSurah);
  loadJuz();
};

const btnBookmark = document.getElementById('btnBookmark');

btnBookmark.onclick = () => {
  window.location.href = 'bookmark.html';
};

function setActive(btn) {
  document
    .querySelectorAll('.toggle-btn')
    .forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

let SURAH_CACHE = [];
let QURAN_SEARCH_CACHE = [];
  
function loadSurah() {
  list.innerHTML = 'Memuat surah...';

  fetch('https://equran.id/api/v2/surat')
    .then(res => res.json())
    .then(data => {
      SURAH_CACHE = data.data;
      renderSurah(SURAH_CACHE);
    })
    .catch(() => list.innerHTML = '<p>Gagal memuat Surah</p>');
}

function loadQuranSearch() {
  if (QURAN_SEARCH_CACHE.length) return Promise.resolve(QURAN_SEARCH_CACHE);

  return fetch('../data/quran-search.json')
    .then(res => res.json())
    .then(data => {
      QURAN_SEARCH_CACHE = data;
      return data;
    });
}
  
function renderSurah(data) {
  list.innerHTML = '';

  if (!data.length) {
    list.innerHTML = '<p>Surah tidak ditemukan</p>';
    return;
  }

  data.forEach(s => {
    const item = document.createElement('a');
    item.href = `surah.html?no=${s.nomor}`;
    item.className = 'surah-item';
    item.innerHTML = `
      <div>
        <strong>${s.nomor}. ${s.namaLatin}</strong>
        <small>${s.arti}</small>
      </div>
      <span>${s.jumlahAyat} ayat</span>
    `;
    list.appendChild(item);
  });
}

function loadJuz() {
  list.innerHTML = '';

  JUZ_MAP.forEach(j => {
    const item = document.createElement('a');
    item.href = `juz.html?no=${j.juz}`;
    item.className = 'surah-item';

    const surahName = getSurahName(j.start[0]);
    const ayatNo = j.start[1];

    item.innerHTML = `
      <div>
        <strong>Juz ${j.juz}</strong>
        <small>Mulai dari ${surahName} ayat ${ayatNo}</small>
      </div>
    `;

    list.appendChild(item);
  });
}

  function getSurahName(no) {
  return SURAH_NAMES[no] || `Surah ${no}`;
}

   const openSearch = document.getElementById('openSearch');
const searchBox = document.getElementById('searchBox');
const searchInput = document.getElementById('searchInput');

openSearch.onclick = () => {
  const isOpen = searchBox.style.display === 'block';
  searchBox.style.display = isOpen ? 'none' : 'block';

  if (!isOpen) {
    setActive(btnSurah);
    loadSurah();
    setTimeout(() => searchInput.focus(), 100);
  } else {
    searchInput.value = '';
    renderSurah(SURAH_CACHE);
  }
};

 function renderSearchResults(data) {
  list.innerHTML = '';

  if (!data.length) {
    list.innerHTML = '<p>Hasil tidak ditemukan</p>';
    return;
  }

  data.slice(0, 80).forEach(a => {
    const item = document.createElement('a');

    item.href = `surah.html?no=${a.surah}&ayat=${a.ayat}`;
    item.className = 'surah-item';

    item.innerHTML = `
      <div>
        <strong>${a.nama} : ${a.ayat}</strong>
        <small>${a.terjemahan}</small>
      </div>
      <span>Ayat</span>
    `;

    list.appendChild(item);
  });
}

  
searchInput.addEventListener('input', async () => {
  const q = searchInput.value.toLowerCase().trim();
  const keywords = q.split(/\s+/).filter(Boolean);

  if (!q) {
    renderSurah(SURAH_CACHE);
    return;
  }

  // Kalau pendek, cari nama surah dulu
  if (q.length < 3) {
    const filteredSurah = SURAH_CACHE.filter(s =>
      s.namaLatin.toLowerCase().includes(q) ||
      s.arti.toLowerCase().includes(q) ||
      String(s.nomor).includes(q)
    );

    renderSurah(filteredSurah);
    return;
  }

  try {
    const searchData = await loadQuranSearch();

   const rankedAyat = searchData
  .map(a => {
    const nama = `${a.nama || ''}`.toLowerCase();
    const artiSurah = `${a.artiSurah || ''}`.toLowerCase();
    const terjemahan = `${a.terjemahan || ''}`.toLowerCase();
    const latin = `${a.latin || ''}`.toLowerCase();
    const arab = `${a.arab || ''}`.toLowerCase();
    const nomor = `${a.surah || ''} ${a.ayat || ''}`.toLowerCase();

    const allText = `
      ${nama}
      ${artiSurah}
      ${terjemahan}
      ${latin}
      ${arab}
      ${nomor}
    `;

    let score = 0;

    // Bonus besar kalau frasa lengkap cocok
    if (allText.includes(q)) score += 20;

    // Bonus kalau semua kata ditemukan
    if (keywords.every(k => allText.includes(k))) score += 10;

    keywords.forEach(k => {
      if (terjemahan.includes(k)) score += 5;
      if (nama.includes(k)) score += 3;
      if (artiSurah.includes(k)) score += 3;
      if (latin.includes(k)) score += 2;
      if (arab.includes(k)) score += 2;
      if (nomor.includes(k)) score += 1;
    });

    return {
      ...a,
      score
    };
  })
  .filter(a => a.score > 0)
  .sort((a, b) => b.score - a.score);

renderSearchResults(rankedAyat);
  } catch (err) {
    list.innerHTML = '<p>Gagal memuat data pencarian</p>';
  }
});

</script>
<div id="footer"></div>

<script src="../data/loader.js"></script>
<script>
  loadFooter("quran");
</script>

</body>
</html>
