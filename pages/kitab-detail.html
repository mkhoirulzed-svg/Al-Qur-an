<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Kitab</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
.page-doa{
  background:var(--bg);
}

.doa-container{
  padding:18px 18px 110px;
}

.nav-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  background:var(--card);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow-sm);
}

.header-title{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#judul-doa{
  font-size:17px;
  font-weight:800;
  color:var(--primary);
}

#subjudul-doa{
  font-size:12px;
  color:var(--text-secondary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.doa-card{
  background:var(--card);
  border-radius:22px;
  padding:20px;
  box-shadow:var(--shadow-sm);
  border:1px solid rgba(255,255,255,.7);
  margin-bottom:14px;
}

.doa-title{
  font-size:18px;
  font-weight:800;
  color:var(--primary);
  margin-bottom:16px;
  line-height:1.5;
}

.arab{
  font-family:'Amiri',serif;
  font-size:28px;
  line-height:2.1;
  text-align:right;
  direction:rtl;
  color:var(--text);
  margin-bottom:20px;
}

.terjemah{
  font-size:15px;
  line-height:1.8;
  color:var(--text);
  margin-bottom:14px;
}

.meta{
  font-size:13px;
  line-height:1.7;
  color:var(--text-secondary);
  background:rgba(10,77,58,.08);
  border-radius:16px;
  padding:13px 14px;
  margin-top:14px;
}

#detailKitab p{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  text-align:center;
  color:var(--text-secondary);
  box-shadow:var(--shadow-sm);
}

  .doa-item{
  background:var(--card);
  border-radius:20px;
  padding:17px 18px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:var(--shadow-sm);
  border:1px solid rgba(255,255,255,.7);
  cursor:pointer;
  transition:.25s ease;
}

.doa-item:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}

.doa-item span{
  font-size:15px;
  font-weight:800;
  color:var(--text);
}

.doa-item i{
  color:var(--primary);
  font-size:13px;
}

  .search-box{
  background:var(--card);
  border-radius:22px;
  padding:18px;
  box-shadow:var(--shadow-sm);
  border:1px solid rgba(255,255,255,.7);
  margin-bottom:14px;
}

.search-title{
  font-size:16px;
  font-weight:800;
  color:var(--primary);
  margin-bottom:12px;
}

.search-input-wrap{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(10,77,58,.08);
  border-radius:16px;
  padding:0 14px;
}

.search-input-wrap i{
  color:var(--primary);
  font-size:14px;
}

#searchKitabInput{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  padding:14px 0;
  font-size:15px;
  color:var(--text);
}

#searchKitabInput::placeholder{
  color:var(--text-secondary);
}

.search-info{
  font-size:13px;
  color:var(--text-secondary);
  margin-top:10px;
  line-height:1.6;
}

.search-result-card{
  background:var(--card);
  border-radius:20px;
  padding:17px 18px;
  margin-bottom:12px;
  box-shadow:var(--shadow-sm);
  border:1px solid rgba(255,255,255,.7);
  cursor:pointer;
}

.search-result-card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}

.search-result-title{
  font-size:15px;
  font-weight:800;
  color:var(--primary);
  margin-bottom:10px;
  line-height:1.5;
}

.search-result-arab{
  font-family:'Amiri',serif;
  font-size:22px;
  line-height:2;
  text-align:right;
  direction:rtl;
  color:var(--text);
  margin-bottom:12px;
}

.search-result-text{
  font-size:14px;
  line-height:1.8;
  color:var(--text);
}

mark{
  background:rgba(255,214,10,.45);
  color:inherit;
  padding:1px 4px;
  border-radius:5px;
}
</style>
</head>

<body class="page-doa">

<header class="app-header">
  <button class="nav-btn back-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24" width="22" height="22"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div class="header-title">
    <div id="judul-doa">Detail Kitab</div>
    <div id="subjudul-doa">Memuat isi kitab...</div>
  </div>
</header>

<main class="doa-container">
  <div id="detailKitab">
    <p>Memuat kitab...</p>
  </div>
</main>

<div id="footer"></div>

<script>
const detailKitabEl = document.getElementById('detailKitab');
const judulDoaEl = document.getElementById('judul-doa');
const subjudulDoaEl = document.getElementById('subjudul-doa');

const params = new URLSearchParams(window.location.search);
const idKitab = params.get('id');

async function loadDetailKitab(){
  try{
    if(!idKitab){
      throw new Error('ID kitab tidak ditemukan');
    }

    const res = await fetch('../data/kitab.json?v=' + Date.now());

    if(!res.ok){
      throw new Error('File kitab.json tidak ditemukan');
    }

    const data = await res.json();

    if(!Array.isArray(data)){
      throw new Error('Format kitab.json harus berupa array []');
    }

    const kitab = data.find(item => String(item.id) === String(idKitab));

    if(!kitab){
      detailKitabEl.innerHTML = '<p>Kitab tidak ditemukan.</p>';
      subjudulDoaEl.textContent = 'Data tidak tersedia';
      return;
    }

    renderInfoKitab(kitab);

    if(kitab.status !== 'tersedia'){
      renderBelumTersedia();
      return;
    }

    const daftarBabPath = kitab.daftarBab || kitab.path;

    if(daftarBabPath){
      await loadDaftarBab(kitab, daftarBabPath);
    }else{
      renderBelumTersedia();
    }

  }catch(err){
    detailKitabEl.innerHTML = '<p>Gagal memuat detail kitab.</p>';
    subjudulDoaEl.textContent = 'Terjadi kesalahan';
    console.error('Error load detail kitab:', err);
  }
}

function renderInfoKitab(kitab){
  const judul = kitab.nama || kitab.judul || kitab.kitab || 'Tanpa Judul';

  document.title = judul;
  judulDoaEl.textContent = judul;
  subjudulDoaEl.textContent = kitab.penulis || 'Kitab Hadits';

  detailKitabEl.innerHTML = `
    <article class="doa-card">
      <div class="doa-title">${judul}</div>

      ${kitab.arab ? `
        <div class="arab">${kitab.arab}</div>
      ` : ''}

      ${kitab.penulis ? `
        <div class="meta">
          <div><b>Penulis:</b> ${kitab.penulis}</div>
        </div>
      ` : ''}

      ${kitab.jumlah ? `
        <div class="meta">
          <div><b>Jumlah:</b> ${kitab.jumlah} hadits</div>
        </div>
      ` : ''}

      ${kitab.deskripsi ? `
        <div class="terjemah">${kitab.deskripsi}</div>
      ` : ''}

            <div class="meta">
        <div><b>Status:</b> ${kitab.status === 'tersedia' ? 'Tersedia' : 'Segera hadir'}</div>
      </div>
    </article>

    <div class="search-box">
      <div class="search-title">Cari dalam kitab</div>

      <div class="search-input-wrap">
        <i class="fas fa-search"></i>
        <input
          id="searchKitabInput"
          type="search"
          placeholder="Cari kata, contoh: iman, shalat, niat..."
        >
      </div>

      <div id="searchKitabInfo" class="search-info">
        Memuat index pencarian...
      </div>
    </div>

    <div id="hasilCariKitab"></div>

    <div id="daftarBabKitab">
      <p>Memuat daftar bab...</p>
    </div>
  `;

  setupPencarianKitab(kitab);
}

async function loadDaftarBab(kitab, daftarBabPath){
  const daftarBabEl = document.getElementById('daftarBabKitab');

  try{
    const cleanPath = daftarBabPath.replace(/^\/+/, '');
    const res = await fetch('../' + cleanPath + '?v=' + Date.now());

    if(!res.ok){
      throw new Error('File daftar bab tidak ditemukan: ' + cleanPath);
    }

    const daftarBab = await res.json();

    if(!Array.isArray(daftarBab) || daftarBab.length === 0){
      daftarBabEl.innerHTML = '<p>Daftar bab belum tersedia.</p>';
      return;
    }

    daftarBabEl.innerHTML = daftarBab.map(bab => {
      const idBab = String(bab.id).padStart(3, '0');
      const judulBab = bab.nama || bab.judul || bab.kitab || `Bab ${Number(bab.id)}`;

      return `
        <div class="doa-item" onclick="bukaBab('${kitab.id}', '${idBab}')">
          <span>${judulBab}</span>
          <i class="fas fa-chevron-right"></i>
        </div>
      `;
    }).join('');

  }catch(err){
    daftarBabEl.innerHTML = '<p>Gagal memuat daftar bab.</p>';
    console.error('Error load daftar bab:', err);
  }
}

let searchIndexKitab = [];
let searchTimer = null;

async function setupPencarianKitab(kitab){
  const input = document.getElementById('searchKitabInput');
  const hasilEl = document.getElementById('hasilCariKitab');
  const infoEl = document.getElementById('searchKitabInfo');

  if(!input || !hasilEl || !infoEl) return;

  try{
    const folderKitab = kitab.folder || kitab.id;

    const kandidatPath = [
      kitab.searchIndex,
      `data/${folderKitab}/search-index.json`,
      `data/${kitab.id}/search-index.json`,
      `data/${folderKitab}/index-search.json`,
      `data/${kitab.id}/index-search.json`
    ].filter(Boolean);

    let data = null;
    let pathBerhasil = '';

    for(const path of kandidatPath){
      const cleanPath = String(path).replace(/^\/+/, '');

      try{
        const res = await fetch('../' + cleanPath + '?v=' + Date.now());

        if(res.ok){
          data = await res.json();
          pathBerhasil = cleanPath;
          break;
        }
      }catch(e){
        console.warn('Gagal coba path:', cleanPath, e);
      }
    }

    if(!data){
      infoEl.textContent = 'Pencarian belum tersedia untuk kitab ini.';
      console.error('Semua path search-index gagal:', kandidatPath);
      return;
    }

    if(!Array.isArray(data)){
      infoEl.textContent = 'Format index pencarian tidak valid.';
      console.error('Search index bukan array:', pathBerhasil, data);
      return;
    }

    searchIndexKitab = data;

    infoEl.textContent = `Pencarian siap. Total ${searchIndexKitab.length} data.`;

    console.log('Search index berhasil dimuat:', pathBerhasil, searchIndexKitab.length);

  }catch(err){
    console.error('Gagal memuat search-index:', err);
    infoEl.textContent = 'Gagal memuat fitur pencarian.';
    return;
  }

  input.addEventListener('input', function(){
    clearTimeout(searchTimer);

    searchTimer = setTimeout(() => {
      cariDalamKitab(input.value, hasilEl, infoEl);
    }, 250);
  });
}

function normalizeSearchText(text){
  return String(text || '')
    .toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function cariDalamKitab(keyword, hasilEl, infoEl){
  const q = normalizeSearchText(keyword);

  if(q.length < 2){
    hasilEl.innerHTML = '';
    infoEl.textContent = `Pencarian siap. Total ${searchIndexKitab.length} data.`;
    return;
  }

  const kata = q.split(' ').filter(Boolean);

  const hasil = searchIndexKitab
    .filter(item => {
      const terjemahan = item.terjemahan || item.terjemah || item.indonesia || '';
      const judul = item.judul || item.nama || item.kitab || '';

      const gabungan = normalizeSearchText(`
        ${judul}
        ${item.arab || ''}
        ${item.latin || ''}
        ${terjemahan}
        ${item.faedah || ''}
        ${item.sumber || ''}
      `);

      return kata.every(k => gabungan.includes(k));
    })
    .slice(0, 50);

  infoEl.innerHTML = `Ditemukan <b>${hasil.length}</b> hasil untuk: <b>${escapeHtml(keyword)}</b>`;

  if(hasil.length === 0){
    hasilEl.innerHTML = '<p>Tidak ada hasil ditemukan.</p>';
    return;
  }

  hasilEl.innerHTML = hasil.map(item => {
    const judul = item.judul || item.nama || item.kitab || `Hadits ${item.id}`;
    const bab = normalizeBabId(item.bab || item.idBab || item.kitab_id || '');
    const terjemahan = item.terjemahan || item.terjemah || item.indonesia || '';
    const arab = item.arab || '';

    return `
      <article class="search-result-card" onclick="bukaHasilCari('${escapeAttr(idKitab)}', '${escapeAttr(bab)}', '${escapeAttr(item.id)}')">
        <div class="search-result-title">
          ${escapeHtml(judul)}
        </div>

        ${arab ? `
          <div class="search-result-arab">
            ${escapeHtml(potongText(arab, 220))}
          </div>
        ` : ''}

        ${terjemahan ? `
          <div class="search-result-text">
            ${highlightText(escapeHtml(potongText(terjemahan, 280)), keyword)}
          </div>
        ` : ''}

        <div class="meta">
          <div><b>Bagian:</b> ${escapeHtml(bab)}</div>
          <div><b>No:</b> ${escapeHtml(item.id)}</div>
        </div>
      </article>
    `;
  }).join('');
}

function potongText(text, max){
  text = String(text || '');

  if(text.length <= max) return text;

  return text.slice(0, max).trim() + '...';
}

function highlightText(text, keyword){
  if(!keyword) return text;

  const words = String(keyword)
    .trim()
    .split(/\s+/)
    .filter(w => w.length >= 2);

  let result = String(text || '');

  words.forEach(word => {
    const safe = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${safe})`, 'gi');
    result = result.replace(regex, '<mark>$1</mark>');
  });

  return result;
}

function normalizeBabId(value){
  if(value === null || value === undefined || value === '') return '';

  const text = String(value).trim();

  if(/^\d+$/.test(text)){
    return text.padStart(3, '0');
  }

  return text;
}  
  
function bukaHasilCari(idKitab, idBab, idHadits){
  window.location.href =
    `kitab-baca.html?kitab=${encodeURIComponent(idKitab)}&bab=${encodeURIComponent(idBab)}&hadits=${encodeURIComponent(idHadits)}`;
}

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeAttr(value){
  return String(value ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;');
}  
  
function renderBelumTersedia(){
  const daftarBabEl = document.getElementById('daftarBabKitab');

  if(!daftarBabEl) return;

  daftarBabEl.innerHTML = `
    <p>Isi kitab ini belum tersedia.</p>
  `;
}

function bukaBab(idKitab, idBab){
  window.location.href =
    `kitab-baca.html?kitab=${encodeURIComponent(idKitab)}&bab=${encodeURIComponent(idBab)}`;
}

loadDetailKitab();
</script>
  
<script src="../data/loader.js"></script>
<script>
  loadFooter("kitab");
</script>

</body>
</html>
