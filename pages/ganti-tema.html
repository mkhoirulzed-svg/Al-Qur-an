<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganti Tema</title>

<script>
/* Terapkan tema secepat mungkin agar tidak kedip saat halaman dibuka */
(function(){
  const savedTheme = localStorage.getItem('appTheme') || 'default';
  if(savedTheme !== 'default'){
    document.documentElement.classList.add(savedTheme);
  }
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
.page-tema{
  background:var(--bg);
}

.tema-container{
  padding:18px 18px 110px;
}

.nav-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  background:var(--card);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow-sm);
}

.header-title{
  flex:1;
  display:flex;
  flex-direction:column;
}

.header-title>div:first-child{
  font-size:17px;
  font-weight:800;
  color:var(--primary);
}

.judul-surah{
  font-size:12px;
  color:var(--text-secondary);
}

.tema-card{
  background:var(--card);
  border-radius:24px;
  padding:24px 20px;
  box-shadow:var(--shadow-sm);
  border:1px solid rgba(255,255,255,.7);
  text-align:center;
  animation:fadeUp .35s ease both;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}

.tema-icon{
  width:72px;
  height:72px;
  border-radius:24px;
  margin:0 auto 16px;
  background:linear-gradient(145deg,var(--primary-ghost-strong),var(--primary-ghost));
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.tema-title{
  font-size:18px;
  font-weight:800;
  color:var(--text);
  margin-bottom:6px;
}

.tema-desc{
  font-size:13px;
  color:var(--text-secondary);
  line-height:1.6;
  margin-bottom:22px;
}

.theme-picker{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.theme-option{
  width:100%;
  border:none;
  border-radius:18px;
  padding:15px 16px;
  background:var(--primary-ghost);
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  text-align:left;
  box-shadow:var(--shadow-sm);
  transition:.2s ease;
}

.theme-option:active{
  transform:scale(.985);
}

.theme-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.theme-dot{
  width:42px;
  height:42px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:16px;
}

.dot-green{
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.dot-blue{
  background:linear-gradient(135deg,#2563eb,#38bdf8);
}

.dot-dark{
  background:linear-gradient(135deg,#111827,#374151);
}

.theme-name{
  font-size:15px;
  font-weight:800;
  color:var(--text);
}

.theme-sub{
  font-size:12px;
  color:var(--text-secondary);
  margin-top:2px;
}

.theme-check{
  width:26px;
  height:26px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  color:transparent;
  flex-shrink:0;
}

.theme-option.active{
  background:linear-gradient(135deg,var(--primary),var(--primary-hover));
}

.theme-option.active .theme-name,
.theme-option.active .theme-sub{
  color:#fff;
}

.theme-option.active .theme-check{
  background:rgba(255,255,255,.22);
  color:#fff;
}

.tema-note{
  margin-top:16px;
  padding:14px;
  border-radius:18px;
  background:var(--primary-ghost);
  color:var(--text-secondary);
  font-size:12px;
  line-height:1.6;
  text-align:left;
}
</style>
</head>

<body class="page-tema">

<header class="app-header">
  <button class="nav-btn back-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24" width="22" height="22"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div class="header-title">
    <div>Ganti Tema</div>
    <div class="judul-surah">Pilih warna tampilan aplikasi</div>
  </div>
</header>

<main class="tema-container">

  <div class="tema-card">
    <div class="tema-icon">
      <i class="fas fa-palette"></i>
    </div>

    <div class="tema-title">Tema Aplikasi</div>
    <div class="tema-desc">
      Sesuaikan tampilan aplikasi sesuai kenyamanan. Pilihan tema akan tersimpan
      otomatis di perangkat ini.
    </div>

    <div class="theme-picker">
      <button class="theme-option" data-theme="default" onclick="setTheme('default')">
        <div class="theme-left">
          <div class="theme-dot dot-green">
            <i class="fas fa-leaf"></i>
          </div>
          <div>
            <div class="theme-name">Hijau</div>
            <div class="theme-sub">Tema utama aplikasi</div>
          </div>
        </div>
        <div class="theme-check">
          <i class="fas fa-check"></i>
        </div>
      </button>

      <button class="theme-option" data-theme="theme-blue" onclick="setTheme('theme-blue')">
        <div class="theme-left">
          <div class="theme-dot dot-blue">
            <i class="fas fa-droplet"></i>
          </div>
          <div>
            <div class="theme-name">Biru</div>
            <div class="theme-sub">Tampilan lebih segar</div>
          </div>
        </div>
        <div class="theme-check">
          <i class="fas fa-check"></i>
        </div>
      </button>

      <button class="theme-option" data-theme="theme-dark" onclick="setTheme('theme-dark')">
        <div class="theme-left">
          <div class="theme-dot dot-dark">
            <i class="fas fa-moon"></i>
          </div>
          <div>
            <div class="theme-name">Gelap</div>
            <div class="theme-sub">Nyaman untuk malam hari</div>
          </div>
        </div>
        <div class="theme-check">
          <i class="fas fa-check"></i>
        </div>
      </button>
    </div>

    <div class="tema-note">
      Tema ini hanya tersimpan di browser/perangkat yang sedang digunakan.
      Jika cache browser dihapus, tema akan kembali ke bawaan.
    </div>
  </div>

</main>

<div id="footer"></div>
<script src="../data/loader.js"></script>

<script>
loadFooter();

const THEMES = ['default', 'theme-blue', 'theme-dark'];

function applyTheme(theme){
  document.documentElement.classList.remove('theme-blue', 'theme-dark');

  if(theme !== 'default'){
    document.documentElement.classList.add(theme);
  }

  document.querySelectorAll('.theme-option').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === theme);
  });
}

function setTheme(theme){
  localStorage.setItem('appTheme', theme);
  applyTheme(theme);
}

document.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('appTheme') || 'default';
  applyTheme(savedTheme);
});
</script>

</body>
</html>
