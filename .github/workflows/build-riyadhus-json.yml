name: Build Riyadhus JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Riyadhus JSON
        run: node tools/build-riyadhus-json.js

      - name: Commit hasil JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build Riyadhus Shalihin JSON per bab"
          file_pattern: data/riyadhus/*.json
