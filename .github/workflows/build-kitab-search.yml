name: Build Kitab Search Index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build kitab search index
        run: node tools/build-kitab-search-index.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Build kitab search index"
          git push
