name: Build Shahih Muslim JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-muslim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Shahih Muslim JSON
        run: node tools/build-shahih-muslim.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/shahih-muslim
          git diff --cached --quiet || git commit -m "Build Shahih Muslim JSON"
          git push
