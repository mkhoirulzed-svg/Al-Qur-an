name: Fix Riyadhus Titles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-titles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fix Riyadhus titles
        run: node tools/fix-riyadhus-titles.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/riyadhus data/riyadhus.json
          git diff --cached --quiet || git commit -m "Fix Riyadhus Shalihin chapter titles"
          git push
