name: Build Bulughul Maram

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install cheerio

      - name: Build Bulughul Maram JSON
        run: node tools/build-bulughul-maram-sunnah.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/bulughul-maram package.json package-lock.json
          git diff --cached --quiet || git commit -m "Build Bulughul Maram JSON"
          git push